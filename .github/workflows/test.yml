name: 跨平台测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 语法检查
        run: python -m compileall -q server.py gateway.py official_mcp.py openapi_auth.py openapi_client.py openapi_setup.py openapi_setup_ui.py tencent_drive.py tencent_form.py auth_check.py browser_login.py tests
      - name: 单元和 MCP 协议测试
        run: python -m unittest discover -s tests -v
      - name: 命令行入口检查
        run: |
          python auth_check.py --help
          python browser_login.py --help
          python openapi_setup.py --help
      - name: Windows 安装脚本检查
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Remove-Item -Recurse -Force .venv -ErrorAction SilentlyContinue
          .\install-windows.ps1
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
