[mcp_servers.tencent_docs_complete]
command = "/ABSOLUTE/PATH/tencent-docs-form-mcp/.venv/bin/python"
args = ["/ABSOLUTE/PATH/tencent-docs-form-mcp/gateway.py"]
enabled = true

[mcp_servers.tencent_docs_complete.env]
TENCENT_DOCS_USE_BROWSER_COOKIES = "1"
