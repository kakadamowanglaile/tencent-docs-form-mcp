TENCENT_DOCS_OPENAPI_CLIENT_ID = ""
TENCENT_DOCS_OPENAPI_OPEN_ID = ""
TENCENT_DOCS_OPENAPI_ACCESS_TOKEN = ""
TENCENT_DOCS_OPENAPI_CLIENT_SECRET = ""
TENCENT_DOCS_OPENAPI_REFRESH_TOKEN = ""
