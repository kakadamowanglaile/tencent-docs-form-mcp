[project]
name = "tencent-docs-complete-mcp"
version = "0.5.0"
description = "代理腾讯文档官方 MCP，补充未打包的正式 Open API 和收集表扩展"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "browser-cookie3==0.20.1",
  "httpx2==2.12.0",
  "keyring==25.7.0",
  "mcp==2.2.0",
  "pywin32>=311; sys_platform == 'win32'",
  "websocket-client==1.8.0",
]

[project.urls]
Homepage = "https://github.com/kakadamowanglaile/tencent-docs-form-mcp"
Repository = "https://github.com/kakadamowanglaile/tencent-docs-form-mcp"
Issues = "https://github.com/kakadamowanglaile/tencent-docs-form-mcp/issues"

[tool.uv]
package = false
